name: verify

# Required status check for master (ruleset "master" requires the "verify" check).
# Runs the same gate as the kelvin-verify skill on every pull request and on master.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Unit tests (rules, demo outcomes A/B/C, eval 24/24)
        run: npm test
      - name: Production build
        run: npm run build
